[project]
name = "inspy-logger"
version = "3.2.4"
description = "Colorable, scalable logger for CLI"
authors = [
    { name = "Taylor B.", email = "t.blackstone@inspyre.tech" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "packaging>=26.3,<27.0",
    "platformdirs>=4.12.3,<5.0.0",
    "psutil>=7.2.2,<8.0.0",
    "public-suffix-list>=1.1.0,<2.0.0",
    "pyperclip>=1.11.0,<2.0.0",
    "python-box>=7.4.1,<8.0.0",
    "requests>=2.34.2,<3.0.0",
    "rich>=15.0.0,<16.0.0",
]

[project.scripts]
inspy-logger-tool = "inspy_logger.Scripts.main:main"


[tool.poetry.group.docs.dependencies]
sphinx = "^8.1.3"
sphinx-rtd-theme = "^3.1.0"



[tool.poetry.group.dev.dependencies]
ptipython = "^1.0.1"
ipython = "^8.39.0"
prompt-toolkit = "^3.0.53"
pytest = "^9.1.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
